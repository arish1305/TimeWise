services:
  db:
    image: postgres:15-alpine
    container_name: timewise_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: timewise
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: 
      context: ./backend
    container_name: timewise_backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://admin:password@db:5432/timewise
      AI_ENGINE_URL: http://ai_engine:8001
    depends_on:
      - db
      - ai_engine

  ai_engine:
    build:
      context: ./ai_engine
    container_name: timewise_ai
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --reload
    volumes:
      - ./ai_engine:/app
    ports:
      - "8001:8001"
  
  frontend:
    build:
      context: ./frontend
    container_name: timewise_frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
