services:
  db:
    image: postgres:15-alpine
    container_name: timewise_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: timewise
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build: 
      context: ./backend
    container_name: timewise_backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://admin:password@db:5432/timewise
      AI_ENGINE_URL: http://ai_engine:8001
      BACKEND_CORS_ORIGINS: http://localhost,http://localhost:3000
    depends_on:
      - db
      - ai_engine
    restart: unless-stopped

  ai_engine:
    build:
      context: ./ai_engine
    container_name: timewise_ai
    ports:
      - "8001:8001"
    restart: unless-stopped
  
  frontend:
    build:
      context: ./frontend
    container_name: timewise_frontend
    ports:
      - "3000:80"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
